# noise-bench — add meta/muse-glimmer-30b + meta/muse-spark-1.2 (Docker).
# Same conditions as the frozen leaderboard run: 1800s agent timeout, graded capture.
jobs_dir: jobs
n_attempts: 3
n_concurrent_trials: 8
quiet: false

environment:
  type: docker

agents:
  - name: terminus-2
    model_name: openrouter/meta/muse-glimmer-30b
    override_timeout_sec: 1800
  - name: terminus-2
    model_name: openrouter/meta/muse-spark-1.2
    override_timeout_sec: 1800

datasets:
  - path: datasets/noisebench
    task_names:
      - ai-platform-alert-noise
      - cert-expiry-fanout
      - ci-e2e-test-noise
      - deploy-storm
      - disk-pressure-flapper-storm
      - escalation-loopback-noise
      - maintenance-window-masking
      - mixed-triage-heavy
      - node-event-noise
      - noisy-night-shift
      - obvious-sev1-cluster
      - queue-backlog-vs-blip
      - quiet-but-deadly
      - region-failover-mixed
      - sev1-misconfigured-rule
      - slow-burn-saturation
      - warning-spike-transients
